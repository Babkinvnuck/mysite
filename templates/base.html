{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Мультиблог{% endblock %}</title>
	<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 0;
    }

    nav {
		background-image: url("{% static 'img/header.jpg' %}");
		background-size: cover;
		background-position: center;
		background-color: rgba(0, 0, 0, 0.4);
		padding: 120px 20px;
		display: flex;
		align-items: center;
		justify-content: space-between;
		flex-wrap: wrap;
	}

    nav a {
        color: black;
        text-decoration: none;
        margin-right: 20px;
        font-size: 26px;
    }

    nav a:hover {
        color: #ffcc00;
    }

    nav form {
        display: inline;
        margin: 0;
    }

    nav button {
        background: none;
        border: none;
        color: black;
        font-size: 16px;
        cursor: pointer;
    }

    nav button:hover {
        color: #ffcc00;
    }

    .container {
        max-width: 800px;
        margin: 30px auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1, h2 {
        color: #333;
    }

    a {
        color: #007bff;
    }

    a:hover {
        color: #0056b3;
    }

    button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background-color: #0056b3;
    }

    form p {
        margin-bottom: 15px;
    }

    input[type="text"],
    input[type="password"],
    textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
    }

    ul {
        list-style-type: none;
        padding: 0;
    }

    li {
        margin-bottom: 15px;
        padding: 15px;
        background-color: #f9f9f9;
        border-radius: 5px;
    }
</style>
</head>
<body>
    <nav>
    <a href="{% url 'blogs:blog_list' %}">The history of our planet</a>
    {% if user.is_authenticated %}
        <a href="{% url 'blogs:profile' %}">Личный кабинет</a>
    {% else %}
        <a href="{% url 'login' %}">Войти</a>
        <a href="{% url 'accounts:register' %}">Регистрация</a>
    {% endif %}
</nav>

    <div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
