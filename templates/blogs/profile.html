{% extends "base.html" %}

{% block content %}
<h1>Личный кабинет</h1>
<p>Добро пожаловать, {{ user.username }}!</p>

<h2 style="margin-top: 30px;">Мой аватар</h2>
{% if profile.avatar %}
    <img src="{{ profile.avatar.url }}" alt="Аватар" style="width: 80px; height: 80px; object-fit: cover; margin-bottom: 10px;">
{% else %}
    <div style="width: 80px; height: 80px; background-color: #ddd; margin-bottom: 10px;"></div>
{% endif %}
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ profile_form.as_p }}
    <button type="submit">Сохранить аватар</button>
</form>
{% endblock %}
