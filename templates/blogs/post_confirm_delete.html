{% extends "base.html" %}

{% block content %}
<h1>Удалить запись?</h1>
<p>Вы уверены, что хотите удалить запись «{{ post.title }}»?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a href="{{ post.get_absolute_url }}">Отмена</a>
</form>
{% endblock %}
